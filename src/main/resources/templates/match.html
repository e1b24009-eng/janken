<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>対戦</title>
</head>

<body>
  <h1>対戦</h1>
  <p th:if="${opponent}">[[${username}]] vs [[${opponent.name}]]</p>

  <!-- 相手がCPUのときは，その場で対戦する（/fight） -->
  <div th:if="${opponent != null and opponent.name == 'CPU'}">
    <a th:href="@{/fight(id=${opponent.id},hand='Gu')}">グー</a>
    <a th:href="@{/fight(id=${opponent.id},hand='Choki')}">チョキ</a>
    <a th:href="@{/fight(id=${opponent.id},hand='Pa')}">パー</a>
  </div>
  <!-- 相手が人のときは，手を登録して相手を待つ（/wait） -->
  <div th:if="${opponent != null and opponent.name != 'CPU' and janken == null}">
    <a th:href="@{/wait(id=${opponent.id},hand='Gu')}">グー</a>
    <a th:href="@{/wait(id=${opponent.id},hand='Choki')}">チョキ</a>
    <a th:href="@{/wait(id=${opponent.id},hand='Pa')}">パー</a>
  </div>

  <div th:if="${janken}">
    [[${username}]]の手：[[${janken.playerHand}]]<br>
    [[${opponent.name}]]の手：[[${janken.cpuHand}]]<br>
    結果：[[${janken.result}]]
  </div>

  <a href="/janken">もどる</a>
</body>

</html>
