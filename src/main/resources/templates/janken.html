<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>じゃんけん</title>
</head>

<body>
  <h1>じゃんけん</h1>
  <p th:if="${username}">Hi [[${username}]]</p>
  <a href="/logout">ログアウト</a>

  <div th:if="${entry}">
    <h2>エントリー</h2>
    <ul>
      <li th:each="user : ${entry.users}">[[${user}]]</li>
    </ul>
    <p>今[[${entry.userCount}]]人がエントリーしています</p>
  </div>

  <div>
    <a href="/jankengame?hand=Gu">グー</a>
    <a href="/jankengame?hand=Choki">チョキ</a>
    <a href="/jankengame?hand=Pa">パー</a>
  </div>
  <div th:if="${janken}">
    あなたの手：[[${janken.playerHand}]]<br>
    相手の手：[[${janken.cpuHand}]]<br>
    結果：[[${janken.result}]]
  </div>
</body>

</html>
